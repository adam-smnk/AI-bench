inputs:
  X:
    shape: [BATCH_SIZE, INPUT_SIZE]
    dtype: inherit

inits:
  - dim: INPUT_SIZE
  - dim: HIDDEN_SIZE

ci:
  - params: [X]
    dtype: float32
    dims:
      BATCH_SIZE: 2
      INPUT_SIZE: 32
      HIDDEN_SIZE: 32

mlir-cpu-bench:
  - params: [X]
    dtype: bfloat16
    dims:
      BATCH_SIZE: 128
      INPUT_SIZE: 4096
      HIDDEN_SIZE: 4096
    rtol: 2.e-2
    atol: 16.0
    flop: "2*BATCH_SIZE*INPUT_SIZE*HIDDEN_SIZE + BATCH_SIZE*HIDDEN_SIZE"

bench-cpu:
  - params: [X]
    dtype: bfloat16
    dims:
      BATCH_SIZE: 128
      INPUT_SIZE: 32768
      HIDDEN_SIZE: 32768
