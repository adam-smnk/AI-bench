inputs:
  X:
    shape: [BATCH_SIZE, INPUT_SIZE]
    dtype: inherit

inits:
  - dim: INPUT_SIZE
  - dim: HIDDEN_SIZE
  - dim: OUTPUT_SIZE

ci:
  - params: [X]
    dtype: float32
    dims:
      BATCH_SIZE: 2
      INPUT_SIZE: 32
      HIDDEN_SIZE: 64
      OUTPUT_SIZE: 16

mlir-cpu-bench:
  - params: [X]
    dtype: bfloat16
    dims:
      BATCH_SIZE: 128
      INPUT_SIZE: 2048
      HIDDEN_SIZE: 4096
      OUTPUT_SIZE: 1024
    rtol: 2.e-2
    atol: 1.e-1
    flop: "2*BATCH_SIZE*(INPUT_SIZE*HIDDEN_SIZE + HIDDEN_SIZE*OUTPUT_SIZE)"

bench-cpu:
  - params: [X]
    dtype: bfloat16
    dims:
      BATCH_SIZE: 16384
      INPUT_SIZE: 2048
      HIDDEN_SIZE: 4096
      OUTPUT_SIZE: 1024
