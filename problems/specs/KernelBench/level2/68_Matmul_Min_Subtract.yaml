inputs:
  X:
    shape: [BATCH_SIZE, IN_FEATURES]
    dtype: inherit

inits:
  - dim: IN_FEATURES
  - dim: OUT_FEATURES
  - dim: CONSTANT

ci:
  - params: [X]
    dtype: float32
    dims:
      BATCH_SIZE: 2
      IN_FEATURES: 32
      OUT_FEATURES: 32
      CONSTANT: 2.0

mlir-cpu-bench:
  - params: [X]
    dtype: bfloat16
    dims:
      BATCH_SIZE: 128
      IN_FEATURES: 4096
      OUT_FEATURES: 4096
      CONSTANT: 2.0
    atol: 4.e-2
    flop: "2*BATCH_SIZE*IN_FEATURES*OUT_FEATURES"

bench-cpu:
  - params: [X]
    dtype: bfloat16
    dims:
      BATCH_SIZE: 128
      IN_FEATURES: 16384
      OUT_FEATURES: 16384
      CONSTANT: 2.0
    atol: 0.04  # ReLU-like kernel suspectible to exploding rtol when expected value is zero.
