inputs:
  X:
    shape: [BATCH_SIZE, IN_FEATURES]
    dtype: inherit

inits:
  - dim: IN_FEATURES
  - dim: OUT_FEATURES
  - dim: SCALING_FACTOR
  - dim: HARDTANH_MIN
  - dim: HARDTANH_MAX

ci:
  - params: [X]
    dtype: float32
    dims:
      BATCH_SIZE: 2
      IN_FEATURES: 32
      OUT_FEATURES: 32
      SCALING_FACTOR: 0.5
      HARDTANH_MIN: -2
      HARDTANH_MAX: 2

simple-cpu:
  - params: [X]
    dtype: bfloat16
    dims:
      BATCH_SIZE: 64
      IN_FEATURES: 256
      OUT_FEATURES: 256
      SCALING_FACTOR: 0.5
      HARDTANH_MIN: -2
      HARDTANH_MAX: 2

mlir-cpu-bench:
  - params: [X]
    dtype: bfloat16
    dims:
      BATCH_SIZE: 128
      IN_FEATURES: 4096
      OUT_FEATURES: 4096
      SCALING_FACTOR: 0.5
      HARDTANH_MIN: -2
      HARDTANH_MAX: 2
    atol: 4.e-2
    flop: "2*BATCH_SIZE*IN_FEATURES*OUT_FEATURES"

bench-cpu:
  - params: [X]
    dtype: bfloat16
    dims:
      BATCH_SIZE: 2048
      IN_FEATURES: 8192
      OUT_FEATURES: 8192
      SCALING_FACTOR: 0.5
      HARDTANH_MIN: -2
      HARDTANH_MAX: 2
