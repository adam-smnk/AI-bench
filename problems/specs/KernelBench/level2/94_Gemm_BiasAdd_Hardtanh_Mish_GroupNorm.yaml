    dtype: bfloat16
    dims:
      BATCH_SIZE: 1024
      IN_FEATURES: 8192
      OUT_FEATURES: 8192
      BIAS_SHAPE: [8192] # TODO: bind these to other dims
      NUM_GROUPS: 256
    atol: 0.025
