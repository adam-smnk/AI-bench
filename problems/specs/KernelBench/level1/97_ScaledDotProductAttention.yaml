inputs:
  Q:
    shape: [BATCH_SIZE, NUM_HEADS, SEQUENCE_LENGTH, EMBEDDING_DIMENSION]
    dtype: inherit
  K:
    shape: [BATCH_SIZE, NUM_HEADS, SEQUENCE_LENGTH, EMBEDDING_DIMENSION]
    dtype: inherit
  V:
    shape: [BATCH_SIZE, NUM_HEADS, SEQUENCE_LENGTH, EMBEDDING_DIMENSION]
    dtype: inherit

inits: []

ci:
  - params: [Q, K, V]
    dtype: float32
    dims:
      BATCH_SIZE: 2
      NUM_HEADS: 8
      SEQUENCE_LENGTH: 16
      EMBEDDING_DIMENSION: 32

simple-cpu:
  - params: [Q, K, V]
    dtype: float32
    dims:
      BATCH_SIZE: 32
      NUM_HEADS: 32
      SEQUENCE_LENGTH: 64
      EMBEDDING_DIMENSION: 128

mlir-cpu-bench:
  - params: [Q, K, V]
    dtype: bfloat16
    dims:
      BATCH_SIZE: 32
      NUM_HEADS: 32
      SEQUENCE_LENGTH: 512
      EMBEDDING_DIMENSION: 64
    atol: 1.0e-02
    flop: "4*BATCH_SIZE*NUM_HEADS*SEQUENCE_LENGTH*SEQUENCE_LENGTH*EMBEDDING_DIMENSION"
  - params: [Q, K, V]
    dtype: bfloat16
    dims:
      BATCH_SIZE: 4
      NUM_HEADS: 32
      SEQUENCE_LENGTH: 2048
      EMBEDDING_DIMENSION: 128
    atol: 1.0e-02
    flop: "4*BATCH_SIZE*NUM_HEADS*SEQUENCE_LENGTH*SEQUENCE_LENGTH*EMBEDDING_DIMENSION"

mlir-gpu-bench:
  - params: [Q, K, V]
    dtype: bfloat16
    dims:
      BATCH_SIZE: 32
      NUM_HEADS: 32
      SEQUENCE_LENGTH: 512
      EMBEDDING_DIMENSION: 64
