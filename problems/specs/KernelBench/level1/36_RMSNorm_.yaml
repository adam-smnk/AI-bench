inputs:
  x:
    shape: [BATCH_SIZE, FEATURES, DIM1, DIM2]
    dtype: inherit

inits:
  - dim: FEATURES

ci:
  - params: [x]
    dtype: float32
    dims:
      BATCH_SIZE: 2
      FEATURES: 4
      DIM1: 64
      DIM2: 64
    flop: "3*BATCH_SIZE*FEATURES*DIM1*DIM2"

simple-cpu:
  - params: [x]
    dtype: bfloat16
    dims:
      BATCH_SIZE: 2
      FEATURES: 4
      DIM1: 64
      DIM2: 64
    flop: "3*BATCH_SIZE*FEATURES*DIM1*DIM2"
    atol: 2.e-2 # bf16 reference sums squares in bf16 (error ~1.2e-2 vs f32)

bench-cpu:
  - params: [x]
    dtype: float32
    dims:
      BATCH_SIZE: 16
      FEATURES: 64
      DIM1: 256
      DIM2: 256
    flop: "3*BATCH_SIZE*FEATURES*DIM1*DIM2"
    mem_bytes: "(2*BATCH_SIZE*FEATURES*DIM1*DIM2) * 4" # f32
