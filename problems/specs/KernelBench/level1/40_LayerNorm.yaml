inputs:
  x:
    shape: [BATCH_SIZE, FEATURES, DIM1, DIM2]
    dtype: inherit

inits:
  - dim: NORMALIZED_SHAPE

ci:
  - params: [x]
    dtype: float32
    dims:
      BATCH_SIZE: 2
      FEATURES: 4
      DIM1: 64
      DIM2: 64
      NORMALIZED_SHAPE: [4, 64, 64] # TODO: bind these to other dims
    flop: "8*BATCH_SIZE*FEATURES*DIM1*DIM2"

simple-cpu:
  - params: [x]
    dtype: float32
    dims:
      BATCH_SIZE: 2
      FEATURES: 4
      DIM1: 64
      DIM2: 64
      NORMALIZED_SHAPE: [4, 64, 64] # TODO: bind these to other dims
    flop: "8*BATCH_SIZE*FEATURES*DIM1*DIM2"

bench-cpu:
  - params: [x]
    dtype: float32
    dims:
      BATCH_SIZE: 16
      FEATURES: 64
      DIM1: 256
      DIM2: 256
      NORMALIZED_SHAPE: [64, 256, 256] # TODO: bind these to other dims
    flop: "8*BATCH_SIZE*FEATURES*DIM1*DIM2"
    mem_bytes: "(2*BATCH_SIZE*FEATURES*DIM1*DIM2) * 4" # f32
