[build-system]
requires = ["setuptools>=60"]
build-backend = "setuptools.build_meta"

[project]
name = "helion-mlir-xpu-utils"
version = "0.1.0"
description = "Helper utilities for AI-bench Helion MLIR XPU kernels"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["helion_mlir_xpu_utils"]

[tool.setuptools.package-dir]
helion_mlir_xpu_utils = "."
